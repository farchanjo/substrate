---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Required gate: build + clippy (-D warnings) + test, on both target
  # platforms (macOS and Linux are both actively built/clippy'd/tested per
  # CLAUDE.md — several cfg(target_os = "linux")-gated code paths only surface
  # bugs when actually compiled on Linux).
  # ---------------------------------------------------------------------------
  build-test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The action requires `toolchain` explicitly (GitHub does not enforce
      # `required: true`, so an omitted input fails at the parse step). The value
      # mirrors rust-toolchain.toml; the ref is pinned to the SHA that resolved
      # from `master`. Installing `@stable` would instead track whatever stable
      # is at run time and silently ignore the pin.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-test-${{ matrix.os }}

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: nextest

      # Three steps, not one: a cucumber failure used to abort the step and the
      # doctests never ran, so the report hid which suite was actually red.
      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace --all-features -E 'not binary(cucumber)' --no-fail-fast

      - name: cargo test --test cucumber (nextest cannot list this harness)
        run: cargo test --workspace --all-features --test cucumber -p substrate-mcp-server

      # `always()` so a cucumber failure does not hide the doctest result.
      - name: cargo test --doc (nextest does not run doctests)
        if: always()
        run: cargo test --workspace --all-features --doc

  # ---------------------------------------------------------------------------
  # Required gate: supply-chain audit. deny.toml already exists and is
  # tracked (advisories/bans/licenses/sources all configured), so this is a
  # real, blocking check rather than a stub.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # ---------------------------------------------------------------------------
  # fmt-advisory: NON-BLOCKING on purpose (continue-on-error: true).
  #
  # rustfmt.toml (tracked at repo root) documents that it sets several
  # nightly-only options; on the stable 1.95 toolchain pinned by this project,
  # rustfmt silently ignores options it doesn't support on stable instead of
  # erroring, which produces pre-existing formatting drift unrelated to any
  # individual PR's diff. Gating `cargo fmt --all -- --check` on this drift
  # would fail CI spuriously for changes that never touch formatting at all.
  # Kept as a visible, non-blocking advisory job instead of a hard gate.
  # ---------------------------------------------------------------------------
  fmt-advisory:
    name: cargo fmt --check (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.95.0

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # speckit validate --deep: native + external SDD validators over doc/arch/.
  #
  # This repo's spec tooling migrated from the old Python `spec` framework to
  # `speckit` (github.com/farchanjo/speckit), a self-contained Rust binary.
  # speckit is not published to crates.io (`publish = false`) and does not
  # yet ship prebuilt release artifacts, and its source repo is private, so a
  # clean GitHub-hosted runner cannot fetch it without a checkout credential.
  #
  # This job is wired as a REAL, blocking gate rather than a stub: when the
  # `SPECKIT_REPO_TOKEN` secret (a PAT or deploy key with read access to
  # farchanjo/speckit) is configured on this repository, it checks out
  # speckit at `main`, builds it with the already-pinned Rust toolchain, and
  # runs `speckit validate --deep` against doc/arch/ as a blocking check.
  # When the secret is absent (e.g. on a fork without repo access), the job
  # skips cleanly instead of failing CI for contributors who cannot hold that
  # credential — run `speckit validate --deep` manually before merging any
  # doc/arch/ change until the secret is wired up. `speckit validate`
  # (native-only, no --deep) is the cheap local/pre-commit check; only the
  # --deep lane belongs in CI per CLAUDE.md.
  # ---------------------------------------------------------------------------
  speckit-validate-deep:
    name: speckit validate --deep (doc/arch/)
    runs-on: ubuntu-latest
    # The `secrets` context is not available to a step-level `if:`, so the token
    # is mapped to a job-level env var and the conditions read that instead.
    env:
      SPECKIT_REPO_TOKEN: ${{ secrets.SPECKIT_REPO_TOKEN }}
    steps:
      - name: Checkout substrate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout speckit source
        if: env.SPECKIT_REPO_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: farchanjo/speckit
          ref: main
          token: ${{ secrets.SPECKIT_REPO_TOKEN }}
          path: .speckit-src

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        if: env.SPECKIT_REPO_TOKEN != ''
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry/build artifacts
        if: env.SPECKIT_REPO_TOKEN != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .speckit-src
          shared-key: speckit-build

      - name: Build and install speckit
        if: env.SPECKIT_REPO_TOKEN != ''
        run: cargo install --locked --path .speckit-src

      - name: speckit validate --deep
        if: env.SPECKIT_REPO_TOKEN != ''
        run: speckit validate --deep

      - name: Skip (SPECKIT_REPO_TOKEN not configured)
        if: env.SPECKIT_REPO_TOKEN == ''
        run: |
          echo "::warning::SPECKIT_REPO_TOKEN not set — skipping speckit validate --deep."
          echo "Run it manually before merging any doc/arch/ change: speckit validate --deep"
