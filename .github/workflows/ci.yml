---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Required gate: build + clippy (-D warnings) + test, on both target
  # platforms (macOS and Linux are both actively built/clippy'd/tested per
  # CLAUDE.md — several cfg(target_os = "linux")-gated code paths only surface
  # bugs when actually compiled on Linux).
  # ---------------------------------------------------------------------------
  build-test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `toolchain:` input on purpose: the `@master` ref of this action
      # auto-detects and installs the exact channel/profile/components pinned
      # in rust-toolchain.toml (channel = "1.95.0", components = rustfmt,
      # clippy, rust-src). Using the `@stable` shorthand instead would install
      # whatever "stable" resolves to at run time and silently ignore that pin.
      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-test-${{ matrix.os }}

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Required gate: supply-chain audit. deny.toml already exists and is
  # tracked (advisories/bans/licenses/sources all configured), so this is a
  # real, blocking check rather than a stub.
  # ---------------------------------------------------------------------------
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # fmt-advisory: NON-BLOCKING on purpose (continue-on-error: true).
  #
  # rustfmt.toml (tracked at repo root) documents that it sets several
  # nightly-only options; on the stable 1.95 toolchain pinned by this project,
  # rustfmt silently ignores options it doesn't support on stable instead of
  # erroring, which produces pre-existing formatting drift unrelated to any
  # individual PR's diff. Gating `cargo fmt --all -- --check` on this drift
  # would fail CI spuriously for changes that never touch formatting at all.
  # Kept as a visible, non-blocking advisory job instead of a hard gate.
  # ---------------------------------------------------------------------------
  fmt-advisory:
    name: cargo fmt --check (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # spec validate --lane full: intentionally NOT wired into CI.
  #
  # The full spec lane depends on the external Python `spec` framework
  # (normally checked out at ~/dev/fapp/spec-framework on a contributor's
  # machine), managed via uv, plus conftest/vale/Structurizr CLI/TLC. None of
  # that is vendored into this repository or otherwise reachable from a clean
  # GitHub-hosted runner, so a real job here would either depend on a private,
  # unversioned local path (not reproducible in CI) or fail outright. Rather
  # than ship a broken or faked job, this requirement is documented as a
  # MANUAL step to run before merging any change under docs/arch/:
  #
  #   spec validate --lane full
  #
  # The fast lane (`spec validate --lane fast`) is cheap (~1.5s) and already
  # expected to run locally on save / pre-commit per CLAUDE.md, so it does not
  # need a CI job either. Revisit adding a hermetic CI job once spec-framework
  # is published as an installable, versioned artifact (e.g. a pinned
  # uv/PyPI package or a public git ref) that CI can fetch without relying on
  # a contributor's local checkout.
  # ---------------------------------------------------------------------------
  # spec-validate-full:
  #   name: spec validate --lane full (not hermetic in CI — see comment above)
  #   runs-on: ubuntu-latest
  #   if: false
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: |
  #         echo "spec validate --lane full is not hermetic in CI yet."
  #         echo "Run it manually before merging any docs/arch/ change."
